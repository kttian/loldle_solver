<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loldle Solver</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Loldle Solver</h1>
      <p class="subtitle">Enter your guess results to narrow down the champion</p>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="solver">Solver</button>
      <button class="tab" data-tab="glossary">Champion Glossary</button>
    </nav>

    <main id="tab-solver" class="tab-content">
      <section class="input-section">
        <label for="champion-input">Guessed champion:</label>
        <div class="input-row">
          <input
            id="champion-input"
            type="text"
            placeholder="e.g. Ahri"
            autocomplete="off"
          />
          <button id="add-guess-btn">Add Guess</button>
        </div>
        <div id="autocomplete-list" class="autocomplete-list hidden"></div>
      </section>

      <section id="guesses-section" class="hidden">
        <h2>Guesses</h2>
        <div id="guesses-list"></div>
      </section>

      <section id="candidates-section">
        <h2>Remaining candidates: <span id="candidate-count">—</span></h2>
        <div id="candidates-list" class="candidates-grid"></div>
      </section>
    </main>

    <main id="tab-glossary" class="tab-content hidden">
      <section class="glossary-table-wrap">
        <table class="glossary-table" id="glossary-table">
          <colgroup>
            <col style="width:14%">
            <col style="width:9%">
            <col style="width:12%">
            <col style="width:18%">
            <col style="width:10%">
            <col style="width:10%">
            <col style="width:20%">
            <col style="width:7%">
          </colgroup>
          <thead>
            <tr>
              <th data-sort="name">Champion</th>
              <th data-sort="gender">Gender</th>
              <th data-sort="positions">Position</th>
              <th data-sort="species">Species</th>
              <th data-sort="resource">Resource</th>
              <th data-sort="rangeType">Range</th>
              <th data-sort="regions">Region</th>
              <th data-sort="releaseYear">Year</th>
            </tr>
            <tr class="filter-row">
              <td></td>
              <td><select data-filter="gender"><option value="">All</option></select></td>
              <td><select data-filter="positions"><option value="">All</option></select></td>
              <td><select data-filter="species"><option value="">All</option></select></td>
              <td><select data-filter="resource"><option value="">All</option></select></td>
              <td><select data-filter="rangeType"><option value="">All</option></select></td>
              <td><select data-filter="regions"><option value="">All</option></select></td>
              <td><select data-filter="releaseYear"><option value="">All</option></select></td>
            </tr>
          </thead>
          <tbody id="glossary-body"></tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
